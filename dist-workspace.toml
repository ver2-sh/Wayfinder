[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = ["github"]
# Reproducible permission/cost customization checked by scripts/dist-workflow.py.
allow-dirty = ["ci"]
precise-builds = true
installers = ["shell", "powershell"]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]
install-path = "CARGO_HOME"
checksum = "sha256"
source-tarball = false
merge-tasks = true
fail-fast = true
cache-builds = false
pr-run-mode = "skip"

[dist.github-custom-runners]
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
x86_64-apple-darwin = "macos-14"
aarch64-apple-darwin = "macos-14"
