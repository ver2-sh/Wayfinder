[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
ed25519-dalek = "2"
fs2 = "0.4"
hex = "0.4"
rand = "0.8"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rmcp = { version = "3.3.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
nix = { version = "0.30", features = ["signal", "process"] }
wayfinder-core = { path = "crates/wayfinder-core" }
wayfinder-exec = { path = "crates/wayfinder-exec" }
wayfinder-network = { path = "crates/wayfinder-network" }
wayfinder-api = { path = "crates/wayfinder-api" }
wayfinder-mcp = { path = "crates/wayfinder-mcp" }
wayfinder-tui = { path = "crates/wayfinder-tui" }
