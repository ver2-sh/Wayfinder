[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/ver2-sh/Wayfinder"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
directories = "6"
ed25519-dalek = "2"
fs2 = "0.4"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.3.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
url = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
nix = { version = "0.30", features = ["signal", "process"] }
wayfinder-core = { path = "crates/wayfinder-core" }
wayfinder-exec = { path = "crates/wayfinder-exec" }
wayfinder-mcp = { path = "crates/wayfinder-mcp" }
bip39 = { version = "2", features = ["zeroize"] }
hkdf = "0.12"
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
snow = "0.9"
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
rpassword = "7"
wayfinder-agent = { path = "crates/wayfinder-agent" }
wayfinder-gateway = { path = "crates/wayfinder-gateway" }

[profile.dist]
inherits = "release"
lto = "thin"
